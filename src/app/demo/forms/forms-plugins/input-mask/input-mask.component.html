<div class="row">
  <div class="col-md-6">
    <app-card [cardTitle]="'Date' | translate">
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Date' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput mask="00/00/0000" class="form-control" [placeholder]="'DD/MM/YYYY' | translate" />
        </div>
      </div>
      <div class="row">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Valid Date And Month' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput mask="d0/M0/0000" class="form-control" [placeholder]="'DD/MM/YYYY' | translate" />
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-md-6">
    <app-card [cardTitle]="'Time' | translate">
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Date And Hour' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput mask="00/00/00 00:00:00" class="form-control" [placeholder]="'DD/MM/YYYY HH:MM:SS' | translate" />
        </div>
      </div>
      <div class="row">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Valid 24 Hour Format' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput mask="Hh:m0:s0" class="form-control" [placeholder]="'HH:MM:SS' | translate" />
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-md-6">
    <app-card [cardTitle]="'Mixed Type' | translate">
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'MIXED' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput mask="AAA 000-S0S" class="form-control" [placeholder]="'AAA 000-S0S' | translate" />
        </div>
      </div>
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Mask With Special Characters' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input
            showMaskTyped="true"
            [specialCharacters]="['e', 'x', 't', ' ', '(', ')', '-', '.']"
            placeholder="'(___) ___-____ . ______'"
            mask="(000) 000-0000 ext. 000000"
            class="form-control"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Dynamic Mask' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" mask="(00) 00000000||+00 (00) 00000000" class="form-control" placeholder="(00) 00000000||+00 (00) 00000000" />
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-md-6">
    <app-card [cardTitle]="'Multi Options' | translate">
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Prefix' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" prefix="+7 " mask="(000) 000 00 00" class="form-control" placeholder="(00) 000 000" />
        </div>
      </div>
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Suffix' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input matInput type="text" suffix=" $" mask="0000" class="form-control" placeholder="0 000" />
        </div>
      </div>
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Drop Special Characters' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" [dropSpecialCharacters]="false" mask="000-000.00" class="form-control" placeholder="000-000.00" />
        </div>
      </div>
      <div class="row">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Show Mask Type' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input mask="(000) 000-0000" [showMaskTyped]="true" class="form-control" placeholder="(000) 000-0000" />
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-md-12">
    <app-card [cardTitle]="'Separators' | translate">
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Thousand Separator' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" mask="separator" class="form-control" [placeholder]="'separator' | translate" />
        </div>
      </div>
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Thousand Separator' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" mask="separator" thousandSeparator="." class="form-control" [placeholder]="'Dot Separator' | translate" />
        </div>
      </div>
      <div class="row form-group">
        <div class="col-form-label col-lg-3 col-sm-12 text-lg-end">
          <label>{{ 'Comma Separator' | translate }}</label>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <input type="text" mask="separator.0" thousandSeparator="," class="form-control" [placeholder]="'Comma Separator' | translate" />
        </div>
      </div>
    </app-card>
  </div>
</div>
