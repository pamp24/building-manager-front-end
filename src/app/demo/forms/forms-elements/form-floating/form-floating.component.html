<!-- [ Main Content ] start -->
<div class="row">
  <!-- [ form-element ] start -->
  <div class="col-md-12">
    <app-card [cardTitle]="'Floating labels' | translate">
      <h5>{{ 'Form controls' | translate }}</h5>
      <hr />
      <form>
        <div class="row">
          <div class="col-md-6">
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="floatingInput" [placeholder]="'Email address' | translate" />
              <label for="floatingInput">{{ 'Email address' | translate }}</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="floatingPassword" [placeholder]="'Password' | translate" />
              <label for="floatingPassword">{{ 'Password' | translate }}</label>
            </div>
          </div>
        </div>
      </form>
      <h5 class="mt-4">{{ 'Default Value' | translate }}</h5>
      <hr />
      <div class="row">
        <div class="col-md-6">
          <form class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="floatingInputValue"
              [placeholder]="'name@example.com' | translate"
              value="test@example.com"
            />
            <label for="floatingInputValue">{{ 'Input with value' | translate }}</label>
          </form>
        </div>
        <div class="col-md-6">
          <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingpassword1" [placeholder]="'password' | translate" value="Password" />
            <label for="floatingpassword1">{{ 'Password' | translate }}</label>
          </div>
        </div>
      </div>
      <h5 class="mt-4">{{ 'Validation styles' | translate }}</h5>
      <hr />
      <div class="row">
        <div class="col-md-6">
          <form class="form-floating mb-3">
            <input
              type="email"
              class="form-control is-valid"
              id="floatingInputInvalid"
              [placeholder]="'name@example.com' | translate"
              value="test@example.com"
            />
            <label for="floatingInputInvalid">{{ 'Valid input' | translate }}</label>
          </form>
        </div>
        <div class="col-md-6">
          <form class="form-floating mb-3">
            <input
              type="email"
              class="form-control is-invalid"
              id="floatingInputInvalid"
              [placeholder]="'name@example.com' | translate"
              value="test@example.com"
            />
            <label for="floatingInputInvalid">{{ 'Invalid input' | translate }}</label>
          </form>
        </div>
      </div>
    </app-card>
    <app-card [cardTitle]="'TextAreas' | translate">
      <div class="row">
        <div class="col-md-6">
          <h5 class="mt-5">{{ 'Default style' | translate }}</h5>
          <hr />
          <div class="form-floating">
            <textarea class="form-control" id="floatingTextarea"></textarea>
            <label for="floatingTextarea">{{ 'Comments' | translate }}</label>
          </div>
        </div>
        <div class="col-md-6">
          <h5 class="mt-5">{{ 'Custom height' | translate }}</h5>
          <hr />
          <div class="form-floating">
            <textarea class="form-control" id="floatingTextarea2" style="height: 100px"></textarea>
            <label for="floatingTextarea2">{{ 'Comments' | translate }}</label>
          </div>
        </div>
      </div>
      <h5 class="mt-4">{{ 'Validation styles' | translate }}</h5>
      <hr />
      <div class="row">
        <div class="col-md-6">
          <div class="form-floating mb-3">
            <textarea class="form-control is-valid" rows="3" [placeholder]="'Leave a comment here' | translate" id="floatingTextarea1">{{
              'Valid textarea' | translate
            }}</textarea>
            <label for="floatingTextarea1">{{ 'Comments' | translate }}</label>
          </div>
        </div>
        <div class="col-md-6">
          <form class="form-floating mb-3">
            <textarea class="form-control is-invalid" rows="3" [placeholder]="'Leave a comment here' | translate" id="floatingTextarea21">{{
              'Invalid textarea' | translate
            }}</textarea>
            <label for="floatingTextarea21">{{ 'Comments' | translate }}</label>
          </form>
        </div>
      </div>
    </app-card>
    <app-card [cardTitle]="'Select' | translate">
      <div class="row">
        <div class="col-md-12">
          <div class="form-floating">
            <select class="form-select" id="floatingSelect" [attr.aria-label]="'Floating label select example' | translate">
              <option selected>{{ 'Open this select menu' | translate }}</option>
              <option value="1">{{ 'One' | translate }}</option>
              <option value="2">{{ 'Two' | translate }}</option>
              <option value="3">{{ 'Three' | translate }}</option>
            </select>
            <label for="floatingSelect">{{ 'Works with selects' | translate }}</label>
          </div>
        </div>
      </div>
      <h5 class="mt-4">{{ 'Validation styles' | translate }}</h5>
      <hr />
      <div class="row">
        <div class="col-md-6">
          <div class="form-floating mb-3">
            <select class="form-select is-valid" id="floatingselect1" [attr.aria-label]="'Floating label select example' | translate">
              <option selected>{{ 'Open this select menu' | translate }}</option>
              <option value="1">{{ 'One' | translate }}</option>
              <option value="2">{{ 'Two' | translate }}</option>
              <option value="3">{{ 'Three' | translate }}</option>
            </select>
            <label for="floatingselect1">{{ 'Comments' | translate }}</label>
          </div>
        </div>
        <div class="col-md-6">
          <form class="form-floating mb-3">
            <select class="form-select is-invalid" id="floatingselect2" [attr.aria-label]="'Floating label select example' | translate">
              <option selected>{{ 'Open this select menu' | translate }}</option>
              <option value="1">{{ 'One' | translate }}</option>
              <option value="2">{{ 'Two' | translate }}</option>
              <option value="3">{{ 'Three' | translate }}</option>
            </select>
            <label for="floatingselect2">{{ 'Comments' | translate }}</label>
          </form>
        </div>
      </div>
    </app-card>
  </div>
  <!-- [ form-element ] end -->
</div>
<!-- [ Main Content ] end -->
