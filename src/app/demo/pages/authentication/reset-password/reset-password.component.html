<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:"><img src="assets/images/oikio-logo.png" alt="Oikio" width="117" /></a>
      </div>
      <div class="card my-5">
        <div class="card-body">
          <div class="mb-4">
            <h3 class="mb-2">
              <b>{{ 'Reset Code' | translate }}</b>
            </h3>
            <p class="text-muted">{{ 'Please choose a new password' | translate }}</p>
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="Password">{{ 'Code' | translate }}</label>
            <input [(ngModel)]="password" type="password" id="Password" class="form-control" [placeholder]="'Code' | translate" />
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="Conform Password">{{ 'Code Confirmation' | translate }}</label>
            <input
              [(ngModel)]="confirmPassword"
              type="password"
              id="Conform Password"
              class="form-control"
              [placeholder]="'Code Confirmation' | translate"
            />
          </div>
          <div class="d-grid mt-4">
            <button (click)="resetPassword()" type="button" class="btn btn-primary">{{ 'Reset Code' | translate }}</button>
          </div>
        </div>
      </div>
      <div class="auth-footer row">
        <div class="col my-1">
          <p class="m-0">
            {{ 'Copyright ©' | translate }}
            <a href="/" target="_blank">{{ 'Building Manager' | translate }}</a>
          </p>
        </div>
        <div class="col-auto my-1">
          <ul class="list-inline footer-link mb-0">
            <li class="list-inline-item">
              <a href="/" target="_blank">{{ 'Home Page' | translate }}</a>
            </li>
            <li class="list-inline-item">
              <a href="/" target="_blank">{{ 'Privacy Policy' | translate }}</a>
            </li>
            <li class="list-inline-item">
              <a href="/" target="_blank">{{ 'Communication' | translate }}</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
