<!-- [ Main Content ] start -->
<div class="maintenance-block">
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <div class="card error-card">
          <div class="card-body">
            <div class="error-image-block">
              <div class="row justify-content-center">
                <div class="col-10">
                  <img class="img-fluid" src="assets/images/pages/Error500.png" alt="error img" />
                </div>
              </div>
            </div>
            <div class="text-center">
              <h1 class="mt-4">
                <b>{{ 'Internal Server Error' | translate }}</b>
              </h1>
              <p class="mt-2 mb-4 text-sm text-muted">
                {{ 'Server Error 500. We are fixing the problem. Please' | translate }}
                <br />
                {{ 'try again later.' | translate }}
              </p>
              <a [routerLink]="['/dashboard/default']" type="button" class="btn btn-primary mb-3">{{ 'Return to original' | translate }}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- [ Main Content ] end -->
