<app-card [showHeader]="false">
  <div class="mb-3 text-center">
    <h5 class="mb-0">{{ 'Status of Documents' | translate }}</h5>
    <small class="text-muted">{{ 'Per Month' | translate }}</small>
  </div>

  <ng-container *ngIf="chartOptions; else noData">
    <div id="chart">
      <apx-chart
        [chart]="chartOptions.chart"
        [series]="chartOptions.series"
        [colors]="chartOptions.colors"
        [dataLabels]="chartOptions.dataLabels"
        [xaxis]="chartOptions.xaxis"
        [yaxis]="chartOptions.yaxis"
        [grid]="chartOptions.grid"
        [legend]="chartOptions.legend"
        [tooltip]="chartOptions.tooltip"
        [plotOptions]="chartOptions.plotOptions"
      ></apx-chart>
    </div>
  </ng-container>

  <ng-template #noData>
    <div class="dashboard-empty-state" style="--empty-state-height: 450px">{{ 'No data available' | translate }}</div>
  </ng-template>
</app-card>
