<form [formGroup]="form" (ngSubmit)="onFinish()">
  <div formArrayName="apartments">
    <div *ngFor="let group of apartments.controls; let i = index" [formGroupName]="i" class="card shadow-sm mb-4">
      <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{{ 'Apartment' | translate }} {{ i + 1 }}</h5>
        <button *ngIf="apartments.length > 1" type="button" class="btn btn-sm btn-outline-danger" (click)="removeApartment(i)">
          <i class="bi bi-trash"></i>
          {{ 'Removal' | translate }}
        </button>
      </div>

      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">{{ 'Name of Owner' | translate }}</label>
            <input class="form-control" formControlName="ownerFirstName" [readonly]="group.get('isManagerHouse')?.value" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ "Owner's Last Name" | translate }}</label>
            <input class="form-control" formControlName="ownerLastName" [readonly]="group.get('isManagerHouse')?.value" />
          </div>

          <div class="col-md-4">
            <label class="form-label">{{ 'Is it for rent?' | translate }}</label>
            <select class="form-select" formControlName="isRented">
              <option [ngValue]="null">{{ 'Choose' | translate }}</option>
              <option [ngValue]="true">{{ 'Yes' | translate }}</option>
              <option [ngValue]="false">{{ 'Nope' | translate }}</option>
            </select>
          </div>

          <ng-container *ngIf="group.get('isRented')?.value === true">
            <div class="col-md-4">
              <label class="form-label">{{ 'Tenant Name' | translate }}</label>
              <input class="form-control" formControlName="residentFirstName" />
            </div>
            <div class="col-md-4">
              <label class="form-label">{{ 'Name of Tenant' | translate }}</label>
              <input class="form-control" formControlName="residentLastName" />
            </div>
          </ng-container>

          <div class="col-md-4">
            <label class="form-label">{{ 'Apartment Number' | translate }}</label>
            <input class="form-control" formControlName="apartmentNumber" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'Floor' | translate }}</label>
            <select class="form-select" formControlName="floor">
              <option value="">{{ 'Choose' | translate }}</option>

              <option *ngFor="let f of floorOptions; trackBy: trackByFloor" [value]="f">
                {{ f | translate }}
              </option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'Square Meters' | translate }}</label>
            <input class="form-control" type="number" formControlName="sqMetersApart" />
          </div>

          <div class="col-md-4">
            <label class="form-label">{{ 'It has Parking' | translate }}</label>
            <select class="form-select" formControlName="hasParking">
              <option [ngValue]="null">{{ 'Choose' | translate }}</option>
              <option [ngValue]="true">{{ 'Yes' | translate }}</option>
              <option [ngValue]="false">{{ 'Nope' | translate }}</option>
            </select>
          </div>
          <ng-container *ngIf="group.get('hasParking')?.value === true">
            <div class="col-md-4">
              <label class="form-label">{{ 'Parking Space Number' | translate }}</label>
              <input class="form-control" formControlName="parkingSlot" />
            </div>
          </ng-container>

          <div class="col-md-4">
            <label class="form-label">{{ 'Thousands of Users' | translate }}</label>
            <input type="number" class="form-control" formControlName="commonPercent" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'Elevator kilometers' | translate }}</label>
            <input type="number" class="form-control" formControlName="elevatorPercent" />
          </div>
          <div class="col-md-4">
            <label class="form-label">{{ 'Kilometers of Heating' | translate }}</label>
            <input type="number" class="form-control" formControlName="heatingPercent" />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-4" *ngIf="storageLimit > 0">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                formControlName="hasStorage"
                [disabled]="!group.get('hasStorage')?.value && currentUsedStorages >= storageLimit"
              />
              <label class="form-check-label">{{ 'It has a warehouse' | translate }}</label>
            </div>
            <small class="text-danger" *ngIf="!group.get('hasStorage')?.value && currentUsedStorages >= storageLimit">
              {{ 'The storage limit has been reached.' | translate }}
            </small>
          </div>
          <ng-container *ngIf="group.get('hasStorage')?.value">
            <div class="col-md-4">
              <label class="form-label">{{ 'Warehouse Number' | translate }}</label>
              <input class="form-control" formControlName="storageSlot" />
            </div>
          </ng-container>
        </div>

        <ng-container *ngIf="managerHouseExist">
          <div class="col-md-4 mt-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" formControlName="isManagerHouse" />
              <label class="form-check-label">{{ 'Admin Apartment' | translate }}</label>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0">
    {{ errorMessage }}
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-secondary" (click)="onBack()">{{ 'Invalid' | translate }}</button>
    <button type="button" class="btn btn-outline-primary" (click)="addApartment()">
      <i class="bi bi-plus-circle"></i>
      {{ 'Add Apartment' | translate }}
    </button>
    <button type="submit" class="btn btn-success">
      <i class="bi bi-check-circle"></i>
      {{ 'Completion' | translate }}
    </button>
  </div>
</form>
