<div class="modal-header">
  <h5 class="modal-title">{{ 'New Vote' | translate }}</h5>
  <button type="button" class="btn-close" [attr.aria-label]="'Close' | translate" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <div class="card mb-3 p-3">
    <form (ngSubmit)="createPoll()">
      <div class="mb-3">
        <label class="form-label">{{ 'Title' | translate }}</label>
        <input type="text" class="form-control" [(ngModel)]="newPoll.title" name="title" required />
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'Description' | translate }}</label>
        <textarea class="form-control" [(ngModel)]="newPoll.description" name="description"></textarea>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'Start Date' | translate }}</label>
          <div class="input-group">
            <input
              class="form-control"
              [placeholder]="'yyyy-mm-dd' | translate"
              name="startDateText"
              ngbDatepicker
              #startDp="ngbDatepicker"
              [(ngModel)]="startDateModel"
              readonly
            />
            <button type="button" class="btn btn-outline-secondary" (click)="startDp.toggle()">
              <i class="f-16" antIcon type="calendar" theme="outline"></i>
            </button>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'Expiration Date' | translate }}</label>
          <div class="input-group">
            <input
              class="form-control"
              [placeholder]="'yyyy-mm-dd' | translate"
              name="endDateText"
              ngbDatepicker
              #endDp="ngbDatepicker"
              [(ngModel)]="endDateModel"
              readonly
            />
            <button type="button" class="btn btn-outline-secondary" (click)="endDp.toggle()">
              <i class="f-16" antIcon type="calendar" theme="outline"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" [(ngModel)]="newPoll.multipleChoice" id="multipleChoice" name="multipleChoice" />
        <label class="form-check-label" for="multipleChoice">{{ 'Multiple votes' | translate }}</label>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ 'Options' | translate }}</label>

        <div *ngFor="let opt of newPoll.options; let i = index" class="input-group mb-2">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newPoll.options[i].text"
            name="option{{ i }}"
            [placeholder]="'Type option' | translate"
            required
          />

          <button type="button" class="btn btn-outline-danger" (click)="removeOption(i)">✕</button>
        </div>

        <button type="button" class="btn btn-sm btn-outline-success" (click)="addOption()">
          {{ '+ Add option' | translate }}
        </button>
      </div>

      <!-- ΚΑΤΩ ΚΟΥΜΠΙΑ -->
      <div class="d-flex justify-content-start gap-2 mt-4">
        <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">{{ 'Invalid' | translate }}</button>
        <button type="submit" class="btn btn-primary">{{ 'Save' | translate }}</button>
      </div>
    </form>
  </div>
</div>
