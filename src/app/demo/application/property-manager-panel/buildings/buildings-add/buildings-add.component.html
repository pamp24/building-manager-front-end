<div class="row">
  <div class="col-12">
    <app-card [cardTitle]="'New apartment building' | translate">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Name*' | translate }}</label>
            <input class="form-control" formControlName="name" />
            <div class="text-danger mt-1" *ngIf="isSubmitted && form.get('name')?.invalid">{{ 'Mandatory.' | translate }}</div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Street 1*' | translate }}</label>
            <input class="form-control" formControlName="street1" />
            <div class="text-danger mt-1" *ngIf="isSubmitted && form.get('street1')?.invalid">{{ 'Mandatory.' | translate }}</div>
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Number*' | translate }}</label>
            <input class="form-control" formControlName="stNumber1" />
            <div class="text-danger mt-1" *ngIf="isSubmitted && form.get('stNumber1')?.invalid">{{ 'Mandatory.' | translate }}</div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Street 2' | translate }}</label>
            <input class="form-control" formControlName="street2" />
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Number 2' | translate }}</label>
            <input class="form-control" formControlName="stNumber2" />
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">{{ 'Country*' | translate }}</label>
            <select class="form-select" formControlName="country">
              <option value="">{{ '-- Select --' | translate }}</option>
              <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">{{ 'County*' | translate }}</label>
            <select class="form-select" formControlName="state">
              <option value="">{{ '-- Select --' | translate }}</option>
              <option *ngFor="let s of states" [value]="s">{{ s }}</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">{{ 'City*' | translate }}</label>
            <input class="form-control" formControlName="city" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Region*' | translate }}</label>
            <input class="form-control" formControlName="region" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Postal Code*' | translate }}</label>
            <input class="form-control" formControlName="postalCode" />
            <div class="text-danger mt-1" *ngIf="isSubmitted && form.get('postalCode')?.invalid">
              {{ '5 digits.' | translate }}
            </div>
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Floors*' | translate }}</label>
            <input type="number" class="form-control" formControlName="floors" />
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Apartments*' | translate }}</label>
            <input type="number" class="form-control" formControlName="apartmentsNum" />
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Total sq.m.*' | translate }}</label>
            <input type="number" class="form-control" formControlName="sqMetersTotal" />
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label">{{ 'Shared sq.m.' | translate }}</label>
            <input type="number" class="form-control" formControlName="sqMetersCommonSpaces" />
          </div>

          <div class="col-md-12 mb-3">
            <label class="form-label">{{ 'Description' | translate }}</label>
            <textarea class="form-control" rows="3" formControlName="buildingDescription"></textarea>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">
                <input type="checkbox" formControlName="parkingExist" class="me-2" />
                {{ 'It has Parking' | translate }}
              </label>
            </div>

            <div class="col-md-4 mb-3" *ngIf="form.get('parkingExist')?.value">
              <label class="form-label">{{ 'Parking spaces*' | translate }}</label>
              <input type="number" class="form-control" formControlName="parkingSpacesNum" />
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">
                <input type="checkbox" formControlName="storageExist" class="me-2" />
                {{ 'It has warehouses' | translate }}
              </label>
            </div>

            <div class="col-md-4 mb-3" *ngIf="form.get('storageExist')?.value">
              <label class="form-label">{{ 'Number of Warehouses*' | translate }}</label>
              <input type="number" class="form-control" formControlName="storageNum" />
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">
              <input type="checkbox" formControlName="undergroundFloorExist" class="me-2" />
              {{ 'Basement' | translate }}
            </label>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">
              <input type="checkbox" formControlName="halfFloorExist" class="me-2" />
              {{ 'Mezzanine' | translate }}
            </label>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">
              <input type="checkbox" formControlName="overTopFloorExist" class="me-2" />
              {{ 'Roof' | translate }}
            </label>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">{{ 'Central Heating' | translate }}</label>
            <select class="form-select" formControlName="hasCentralHeating">
              <option [ngValue]="true">{{ 'Yes' | translate }}</option>
              <option [ngValue]="false">{{ 'Nope' | translate }}</option>
            </select>
          </div>

          <div class="col-md-6 mb-3" *ngIf="form.get('hasCentralHeating')?.value">
            <label class="form-label">{{ 'Press' | translate }}</label>
            <select class="form-select" formControlName="heatingType">
              <option *ngFor="let type of heatingTypes" [value]="type.value">{{ type.label | translate }}</option>
            </select>
          </div>

          <div class="col-md-6 mb-3" *ngIf="form.get('hasCentralHeating')?.value">
            <label class="form-label">{{ 'Capacity (liters)' | translate }}</label>
            <input type="number" class="form-control" formControlName="heatingCapacityLitres" />
          </div>

          <!-- (προαιρετικό) PDF κανονισμού -->
          <div class="col-md-12 mb-3">
            <label class="form-label">{{ 'Apartment Building Regulation (PDF)' | translate }}</label>
            <input type="file" class="form-control" accept="application/pdf" (change)="onFileSelected($event)" />
          </div>

          <div class="col-12">
            <div class="alert alert-warning" *ngIf="error">{{ error }}</div>
          </div>
          <!-- Κουμπιά υποβολής -->
          <div class="col-12 text-end">
            <button type="button" class="btn btn-secondary me-2" (click)="back()">{{ 'Back' | translate }}</button>
            <button class="btn btn-primary" [disabled]="loading">
              {{ loading ? ('Save...' | translate) : ('Building an Apartment Building' | translate) }}
            </button>
          </div>
        </div>
      </form>
    </app-card>
  </div>
</div>
