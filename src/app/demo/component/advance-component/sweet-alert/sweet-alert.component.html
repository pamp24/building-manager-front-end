<div class="row btn-page">
  <div class="col-sm-12">
    <app-card [cardTitle]="'Alerts' | translate">
      <button
        type="button"
        class="btn btn-primary me-2"
        [swal]="{
          title: 'Hello world!'
        }"
      >
        {{ 'Basic' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-success me-2"
        [swal]="{
          title: 'Good job!',
          icon: 'success',
          text: 'You clicked the button!'
        }"
      >
        {{ 'Success' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-warning me-2"
        [swal]="{
          title: 'Good job!',
          icon: 'warning',
          text: 'You clicked the button!'
        }"
      >
        {{ 'Warning' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-danger me-2"
        [swal]="{
          title: 'Good job!',
          icon: 'error',
          text: 'You clicked the button!'
        }"
      >
        {{ 'Error' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-info me-2"
        [swal]="{
          title: 'Good job!',
          icon: 'info',
          text: 'You clicked the button!'
        }"
      >
        {{ 'Info' | translate }}
      </button>
      <button type="button" class="btn btn-primary me-2" (click)="confirmAlert()">{{ 'Success or Cancel' | translate }}</button>
      <button type="button" class="btn btn-primary" (click)="promptAlert()">{{ 'Prompt' | translate }}</button>
    </app-card>
  </div>
  <div class="col-sm-12">
    <app-card [cardTitle]="'SweetAlert 2' | translate">
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Basic message' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              title: 'Any fool can use a computer'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Title with a text under' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              title: 'The Internet?',
              icon: 'question',
              text: 'That thing is still around?'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Title with a error icon' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-danger bs-error-icon"
            [swal]="{
              title: 'Oops...',
              icon: 'error',
              text: 'Something went wrong!',
              footer: '<a>Why do I have this issue?</a>'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Long content inside' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              imageUrl: 'https://placeholder.pics/svg/300x1500',
              imageHeight: '1500',
              imageAlt: 'A tall image'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Custom HTML' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              title: '<strong>HTML <u>example</u></strong>',
              icon: 'info',
              html: 'You can use <b>bold text</b>, ' + '<a>links</a> ' + 'and other HTML tags',
              showCloseButton: true,
              showCancelButton: true,
              focusConfirm: false,
              confirmButtonText: 'Great!'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Dialog with Three buttons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button class="btn btn-light-primary bs-message" (click)="threeBtn()">{{ 'Try me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Custom positioned' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              position: 'top-end',
              icon: 'success',
              title: 'Your work has been saved',
              showConfirmButton: false,
              timer: 1500
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Custom animation' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button class="btn btn-light-primary bs-message" (click)="animationAlert()">{{ 'Try me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">
          {{ 'By passing a parameter, you can execute something' | translate }}
        </label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button class="btn btn-light-primary bs-message" (click)="twoBtn()">{{ 'Try me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Message with a custom image' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              title: 'Sweet!',
              text: 'Modal with a custom image.',
              imageUrl: 'https://unsplash.it/400/200',
              imageWidth: 400,
              imageHeight: 200,
              imageAlt: 'Custom image'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>

      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Auto close timer' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button class="btn btn-light-primary bs-message" (click)="autoClose()">{{ 'Try me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'RTL Languages' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-light-primary bs-message"
            [swal]="{
              title: 'هل تريد الاستمرار؟',
              icon: 'question',
              iconHtml: '؟',
              confirmButtonText: 'نعم',
              cancelButtonText: 'لا',
              showCancelButton: true,
              showCloseButton: true
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'AJAX request' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-light-primary bs-message" (click)="ajaxAlert()">
            {{ 'Try Me!' | translate }}
          </button>
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-sm-12">
    <app-card [cardTitle]="'Icon' | translate">
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Success icons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-primary"
            type="button"
            [swal]="{
              title: 'Success modal',
              icon: 'success'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Error icons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-primary"
            type="button"
            [swal]="{
              title: 'Error modal',
              icon: 'error'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Warning icons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-primary"
            type="button"
            [swal]="{
              title: 'warning modal',
              icon: 'warning'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Info icons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-primary"
            type="button"
            [swal]="{
              title: 'info modal',
              icon: 'info'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Question icons' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            class="btn btn-primary"
            type="button"
            [swal]="{
              title: 'question modal',
              icon: 'question'
            }"
          >
            {{ 'Try me!' | translate }}
          </button>
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-sm-12">
    <app-card [cardTitle]="'Input Type' | translate">
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Ip Address' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button
            type="button"
            class="btn btn-primary"
            [swal]="{
              title: 'Enter your IP address',
              input: 'text'
            }"
          >
            {{ 'Try Me!' | translate }}
          </button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Email' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="gmailAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Url' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="urlAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Password' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="passwordAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Textarea' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="textAreaAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Select' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="selectAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Radio' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="radioAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Checkbox' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="checkboxAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'File' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="fileAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
      <div class="form-group row">
        <label for="" class="col-form-label col-lg-5 col-sm-12 text-lg-end">{{ 'Range' | translate }}</label>
        <div class="col-lg-4 col-md-9 col-sm-12">
          <button type="button" class="btn btn-primary" (click)="rangeAlert()">{{ 'Try Me!' | translate }}</button>
        </div>
      </div>
    </app-card>
  </div>
</div>
