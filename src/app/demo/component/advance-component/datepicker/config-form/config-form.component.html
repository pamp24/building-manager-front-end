<div class="dp-page-content">
  <div class="row">
    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('minValidation')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Min-Date Validation (minDate)' | translate">
            <div class="">
              <div class="dp-option-playground">
                <dp-date-picker
                  [config]="{ format: localFormat }"
                  [formControl]="minValidation"
                  [mode]="pickerMode().startsWith('daytime') ? 'daytime' : 'day'"
                  id="minDatePicker"
                  [placeholder]="'Select a min date' | translate"
                  theme="dp-material"
                ></dp-date-picker>
              </div>
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('maxValidation')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Max-Date Validation (maxDate)' | translate">
            <div class="">
              <div class="dp-option-playground">
                <dp-date-picker
                  [config]="{ format: localFormat }"
                  [formControl]="maxValidation"
                  [mode]="pickerMode().startsWith('daytime') ? 'daytime' : 'day'"
                  id="maxDatePicker"
                  [placeholder]="'Select a max date' | translate"
                  theme="dp-material"
                ></dp-date-picker>
              </div>
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('firstDayOfWeek')) {
        <div class="dp-option">
          <app-card [cardTitle]="'First Day of The week' | translate">
            <div class="dp-option-playground">
              <select
                class="form-select"
                [formControl]="firstDayOfWeek"
                [attr.aria-label]="'Default select example' | translate"
                id="firstDayOfWeekSelect"
              >
                @for (day of DAYS; track day) {
                  <option [value]="day">{{ day }}</option>
                }
              </select>
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('monthFormat')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Month Format (monthFormat)' | translate">
            <div class="dp-option-playground">
              <input [formControl]="monthFormat" id="monthFormatInput" />
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('min')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Min Selectable Date (min)' | translate">
            <div class="dp-option-playground">
              <dp-date-picker
                [config]="{ format: localFormat }"
                [formControl]="min"
                [mode]="pickerMode().startsWith('daytime') ? 'daytime' : 'day'"
                id="minSelectable"
                [placeholder]="'Select a min date' | translate"
                theme="dp-material"
              ></dp-date-picker>
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('max')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Max Selectable Date (max)' | translate">
            <div class="dp-option-playground">
              <dp-date-picker
                [config]="{ format: localFormat }"
                [formControl]="max"
                [mode]="pickerMode().startsWith('daytime') ? 'daytime' : 'day'"
                id="maxSelectable"
                [placeholder]="'Select a max date' | translate"
                theme="dp-material"
              ></dp-date-picker>
            </div>
          </app-card>
        </div>
      }
    </div>

    <div class="col-sm-6 col-lg-4">
      @if (isValidConfig('showNearMonthDays')) {
        <div class="dp-option">
          <app-card [cardTitle]="'Show near Month Days (Show Near Month Days)' | translate">
            <div class="dp-option-playground">
              <label class="px-2 monthdayshow">
                {{ 'Show' | translate }}
                <input
                  class="ms-2"
                  [formControl]="showNearMonthDays"
                  [value]="true"
                  id="showNearMonthDaysRadio"
                  name="showNearMonthDays"
                  type="radio"
                />
              </label>
              <label class="monthdayshow">
                {{ 'Hide' | translate }}
                <input
                  class="ms-2"
                  [formControl]="showNearMonthDays"
                  [value]="false"
                  id="hideNearMonthDaysRadio"
                  name="showNearMonthDays"
                  type="radio"
                />
              </label>
            </div>
          </app-card>
        </div>
      }
    </div>
  </div>
</div>
