<div class="row">
  <div class="col-xxl-6">
    <app-card [cardTitle]="'Tooltip' | translate" blockClass="pc-component">
      <button type="button" class="btn btn-danger me-2 mb-2" placement="top" [ngbTooltip]="'Tooltip on top' | translate">
        {{ 'Top' | translate }}
      </button>
      <button type="button" class="btn btn-primary me-2 mb-2" placement="end" [ngbTooltip]="'Tooltip on right' | translate">
        {{ 'Right' | translate }}
      </button>
      <button type="button" class="btn btn-success me-2 mb-2" placement="bottom" [ngbTooltip]="'Tooltip on bottom' | translate">
        {{ 'Bottom' | translate }}
      </button>
      <button type="button" class="btn btn-warning me-2 mb-2" placement="start" [ngbTooltip]="'Tooltip on left' | translate">
        {{ 'Left' | translate }}
      </button>
      <button type="button" class="btn btn-info mb-2" placement="top" [ngbTooltip]="'Tooltip with HTML' | translate">
        {{ 'Html Tooltip' | translate }}
      </button>
    </app-card>
  </div>
  <div class="col-xxl-6">
    <app-card [cardTitle]="'Popover' | translate" blockClass="pc-component">
      <button type="button" class="btn btn-danger me-2 mb-2" placement="top" ngbPopover="top by popover" popoverTitle="Popover on top">
        {{ 'Top' | translate }}
      </button>
      <button type="button" class="btn btn-primary me-2 mb-2" placement="left" ngbPopover="left by popover" popoverTitle="Popover on left">
        {{ 'Left' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-success me-2 mb-2"
        placement="right"
        ngbPopover="Right by popover"
        popoverTitle="Popover on Right"
      >
        {{ 'Right' | translate }}
      </button>
      <button
        type="button"
        class="btn btn-warning me-2 mb-2"
        placement="bottom"
        ngbPopover="Bottom by popover"
        popoverTitle="Popover on Bottom"
      >
        {{ 'Bottom' | translate }}
      </button>
      <button type="button" class="btn btn-info mb-2" placement="top" ngbPopover="Popover by HTML" popoverTitle="Popover with HTML">
        {{ 'Html Popover' | translate }}
      </button>
    </app-card>
  </div>
</div>
