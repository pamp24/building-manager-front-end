<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-12">
      <app-card [cardTitle]="'Toasts' | translate">
        <div class="row">
          <div class="col-md-5">
            <div class="form-group mb-3">
              <label for="toastTitle">
                <strong>{{ 'Title' | translate }}</strong>
              </label>
              <input
                [(ngModel)]="title"
                type="text"
                class="form-control"
                name="toastTitle"
                id="toastTitle"
                [placeholder]="'Toast title' | translate"
              />
            </div>
            <div class="form-group mb-3">
              <label for="toastMessage">
                <strong>{{ 'Message' | translate }}</strong>
              </label>
              <textarea
                [(ngModel)]="message"
                rows="3"
                class="form-control"
                name="toastMessage"
                id="toastMessage"
                [placeholder]="'Toast message' | translate"
              ></textarea>
            </div>

            <div class="form-group mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.enableHtml" id="enableHtml" />
                <label class="form-check-label" for="enableHtml">{{ 'Enable HTML (message)' | translate }}</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.tapToDismiss" id="tapToDismiss" />
                <label class="form-check-label" for="tapToDismiss">{{ 'Tap to dismiss' | translate }}</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.closeButton" id="closeButton" />
                <label class="form-check-label" for="closeButton">{{ 'Close button' | translate }}</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.preventDuplicates" id="preventDuplicates" />
                <label class="form-check-label" for="preventDuplicates">{{ 'Prevent duplicates' | translate }}</label>
              </div>
              <div class="form-check ml-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [(ngModel)]="options.countDuplicates"
                  id="countDuplicates"
                  [disabled]="!options.preventDuplicates"
                />
                <label class="form-check-label" for="countDuplicates">{{ 'Count duplicates' | translate }}</label>
              </div>
              <div class="form-check ml-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [(ngModel)]="options.resetTimeoutOnDuplicate"
                  id="resetTimeoutOnDuplicate"
                  [disabled]="!options.preventDuplicates"
                />
                <label class="form-check-label" for="resetTimeoutOnDuplicate">{{ 'Reset timeout on duplicate' | translate }}</label>
              </div>
              <div class="form-check ml-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [(ngModel)]="options.includeTitleDuplicates"
                  id="includeTitleDuplicate"
                  [disabled]="!options.preventDuplicates"
                />
                <label class="form-check-label" for="includeTitleDuplicate">{{ 'Include title in duplicate checks' | translate }}</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.newestOnTop" id="newestOnTop" />
                <label class="form-check-label" for="newestOnTop">{{ 'New toasts on top' | translate }}</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" [(ngModel)]="options.progressBar" id="progressBar" />
                <label class="form-check-label" for="progressBar">{{ 'Progress bar' | translate }}</label>
              </div>
            </div>
            <fieldset class="form-group mb-3">
              <label>
                <strong>{{ 'Progress Bar Animation' | translate }}</strong>
              </label>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="progressAnimationRadio"
                  [(ngModel)]="options.progressAnimation"
                  value="decreasing"
                  [disabled]="!options.progressBar"
                  id="progressBarDecreasing"
                />
                <label class="form-check-label" for="progressBarDecreasing">{{ 'Decreasing' | translate }}</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="progressAnimationRadio"
                  [(ngModel)]="options.progressAnimation"
                  value="increasing"
                  [disabled]="!options.progressBar"
                  id="progressBarIncreasing"
                />
                <label class="form-check-label" for="progressBarIncreasing">{{ 'Increasing' | translate }}</label>
              </div>
            </fieldset>
          </div>
          <div class="col-md-4 mb-2">
            <div class="form-group mb-3">
              <label for="toastTimeout">
                <strong>{{ 'Timeout' | translate }}</strong>
              </label>
              <input
                type="text"
                [(ngModel)]="options.timeOut"
                (ngModelChange)="fixNumber('timeOut')"
                [disabled]="options.disableTimeOut === true || options.disableTimeOut === 'timeOut'"
                class="form-control"
                id="toastTimeout"
                aria-describedby="toastTimeoutHelp"
              />
              <small id="toastTimeoutHelp" class="form-text text-muted">{{ '0 never expires' | translate }}</small>
            </div>
            <div class="form-group mb-3">
              <label for="toastExtendedTimeout">
                <strong>{{ 'Extended Timeout' | translate }}</strong>
              </label>
              <input
                type="text"
                [(ngModel)]="options.extendedTimeOut"
                (ngModelChange)="fixNumber('extendedTimeOut')"
                [disabled]="options.disableTimeOut === true || options.disableTimeOut === 'extendedTimeOut'"
                class="form-control"
                id="toastExtendedTimeout"
              />
              <small id="toastExtendedTimeoutHelp" class="form-text text-muted">{{ '0 never expires' | translate }}</small>

              <fieldset class="form-group mb-3">
                <label>
                  <strong>{{ 'Disable Timeouts' | translate }}</strong>
                </label>
                <div class="form-check">
                  <input type="radio" class="form-check-input" [(ngModel)]="options.disableTimeOut" [value]="true" id="disableTimeOut1" />
                  <label for="disableTimeOut" class="form-check-label">
                    <code>{{ 'disableTimeOut = true' | translate }}</code>
                  </label>
                </div>
                <div class="form-check">
                  <input type="radio" class="form-check-input" [(ngModel)]="options.disableTimeOut" [value]="false" id="disableTimeOut2" />
                  <label for="disableTimeOut2" class="form-check-label">
                    <code>{{ 'disableTimeOut = false' | translate }}</code>
                  </label>
                </div>
                <div class="form-check">
                  <input type="radio" class="form-check-input" [(ngModel)]="options.disableTimeOut" value="timeOut" id="disableTimeOut3" />
                  <label for="disableTimeOut3" class="form-check-label">
                    <code>{{ 'timeOut' | translate }}</code>
                    {{ 'only' | translate }}
                  </label>
                </div>
                <div class="form-check">
                  <input
                    type="radio"
                    class="form-check-input"
                    [(ngModel)]="options.disableTimeOut"
                    value="extendedTimeOut"
                    id="disableTimeOut4"
                  />
                  <label for="disableTimeOut4" class="form-check-label">
                    <code>{{ 'extendedTimeOut' | translate }}</code>
                    {{ 'only' | translate }}
                  </label>
                </div>
              </fieldset>
            </div>
            <div class="form-group mb-3">
              <label for="maxNumberToasts">
                <strong>{{ 'Maximum Toasts' | translate }}</strong>
              </label>
              <input
                [(ngModel)]="toastr.toastrConfig.maxOpened"
                (ngModelChange)="fixNumber('maxOpened')"
                type="text"
                class="form-control"
                id="maxNumberToasts"
                aria-describedby="maxNumberToastsHelp"
              />
              <small id="maxNumberToastsHelp" class="form-text text-muted">{{ '0 is no limit' | translate }}</small>
              <div class="form-check">
                <input type="checkbox" class="form-check-input" [(ngModel)]="toastr.toastrConfig.autoDismiss" id="autoDismiss" />
                <label for="autoDismiss" class="form-check-label" for="autoDismiss">{{ 'Auto dismiss on max' | translate }}</label>
              </div>
            </div>
            <div class="form-group mb-3">
              <label for="toastExtendedTimeout">
                <strong>{{ 'Ease Time' | translate }}</strong>
              </label>
              <input
                type="text"
                [(ngModel)]="toastr.toastrConfig.easeTime"
                (ngModelChange)="fixNumber('easeTime')"
                class="form-control"
                id="toastExtendedTimeout"
              />
            </div>
          </div>
          <div class="col-md-3">
            <div class="row">
              <div class="col-6 col-md-12">
                <fieldset class="form-group mb-3">
                  <label>
                    <strong>{{ 'Toast Type' | translate }}</strong>
                  </label>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="typeRadios" [(ngModel)]="type" value="success" id="typesuccess" />
                    <label class="form-check-label" for="typesuccess">{{ 'Success' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="typeRadios" [(ngModel)]="type" value="info" id="typeinfo" />
                    <label class="form-check-label" for="typeinfo">{{ 'Info' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="typeRadios" [(ngModel)]="type" value="warning" id="typewarning" />
                    <label class="form-check-label" for="typewarning">{{ 'Warning' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="typeRadios" [(ngModel)]="type" value="error" id="typeerror" />
                    <label class="form-check-label" for="typeerror">{{ 'Error' | translate }}</label>
                  </div>
                </fieldset>
              </div>
              <div class="col-6 col-md-12">
                <fieldset class="form-group mb-3">
                  <label>
                    <strong>{{ 'Toast Position' | translate }}</strong>
                  </label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-top-right"
                      id="toast-top-right"
                    />
                    <label for="toast-top-right" class="form-check-label">{{ 'Top Right' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-bottom-right"
                      id="toast-bottom-right"
                    />
                    <label for="toast-bottom-right" class="form-check-label">{{ 'Bottom Right' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-bottom-left"
                      id="toast-bottom-left"
                    />
                    <label for="toast-bottom-left" class="form-check-label">{{ 'Bottom Left' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-top-left"
                      id="toast-top-left"
                    />
                    <label for="toast-top-left" class="form-check-label">{{ 'Top Left' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-top-full-width"
                      id="top-full-width"
                    />
                    <label for="top-full-width" class="form-check-label">{{ 'Top Full Width' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-bottom-full-width"
                      id="bottom-full-width"
                    />
                    <label for="bottom-full-width" class="form-check-label">{{ 'Bottom Full Width' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-top-center"
                      id="toast-top-center"
                    />
                    <label for="toast-top-center" class="form-check-label">{{ 'Top Center' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="positionRadio"
                      [(ngModel)]="options.positionClass"
                      [disabled]="inline"
                      value="toast-bottom-center"
                      id="toast-bottom-center"
                    />
                    <label for="toast-bottom-center" class="form-check-label">{{ 'Bottom Center' | translate }}</label>
                  </div>
                </fieldset>
                <div class="form-group mb-3">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      (ngModelChange)="setInlineClass($event)"
                      [(ngModel)]="inline"
                      id="inline"
                    />
                    <label for="inline" class="form-check-label">{{ 'Inline Position' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="inlinePositionRadio"
                      (ngModelChange)="setInlinePosition($event)"
                      [(ngModel)]="inlinePositionIndex"
                      [disabled]="!inline"
                      [value]="0"
                      id="inline-a"
                    />
                    <label for="inline-a" class="form-check-label">{{ 'A' | translate }}</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="inlinePositionRadio"
                      (ngModelChange)="setInlinePosition($event)"
                      [(ngModel)]="inlinePositionIndex"
                      [disabled]="!inline"
                      [value]="1"
                      id="inline-b"
                    />
                    <label for="inline-b" class="form-check-label">{{ 'B' | translate }}</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <ng-template #footerTemplate>
            <div class="row mb-3">
              <div class="col-12 text-center">
                <p class="mb-1">
                  <small>{{ 'Toast Controls:' | translate }}</small>
                </p>
                <div class="d-flex justify-content-center">
                  <button (click)="openToast()" type="button" class="btn btn-primary btn-block mx-1">
                    {{ 'Open Toast' | translate }}
                  </button>

                  <button (click)="clearLastToast()" type="button" class="btn btn-outline-primary btn-block mx-1">
                    {{ 'Clear Last Toast' | translate }}
                  </button>

                  <button (click)="clearToasts()" type="button" class="btn btn-outline-primary btn-block mx-1">
                    {{ 'Clear All Toasts' | translate }}
                  </button>
                </div>
              </div>
            </div>
          </ng-template>
        </div>
      </app-card>
    </div>
  </div>
</div>
